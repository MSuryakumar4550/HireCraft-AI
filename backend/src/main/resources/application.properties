# =========================================================
# HIRECRAFT AI - APPLICATION CONFIGURATION
# =========================================================

spring.application.name=backend

server.port=8080


# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hirecraft_ai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379


# =========================================================
# SPRING AI - GOOGLE GEMINI - need to fetch api key from google ai studio
# =========================================================

spring.config.import=optional:file:./environment/.env[.properties]
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# JWT SECURITY
# =========================================================

spring.security.jwt.secret=${JWT_SECRET}
spring.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# =========================================================
# LOGGING
# =========================================================

logging.level.com.hirecraft=INFO