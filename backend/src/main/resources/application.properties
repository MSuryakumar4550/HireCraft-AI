# =========================================================
# HIRECRAFT AI - APPLICATION CONFIGURATION
# =========================================================

spring.application.name=backend

server.port=8080


# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hirecraft_ai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Surya@123}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379


# =========================================================
# SPRING AI - GOOGLE GEMINI (Free Tier available on AI Studio)
# =========================================================

spring.config.import=optional:file:./environment/.env[.properties]
spring.ai.google.genai.api-key=${GEMINI_API_KEY:your_api_key_here}
spring.ai.google.genai.chat.model=gemini-2.5-flash


# =========================================================
# FILE UPLOAD & LOCAL FILE STORAGE (Instead of AWS S3)
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directory on your local machine to save resumes and media
file.upload-dir=${user.home}/hirecraft-uploads/resumes
file.media-dir=${user.home}/hirecraft-uploads/media


# =========================================================
# LOCAL CODE EXECUTION ENGINE (Judge0 Self-Hosted via Docker)
# =========================================================

judge0.api.url=http://localhost:2358
# No API key needed for self-hosted Judge0 CE

# Maximum number of polling attempts before marking the submission as timed out
judge0.poll.max-attempts=20

# Milliseconds between consecutive Judge0 poll requests
# 1500ms * 20 attempts = 30 seconds maximum wait time per test case
judge0.poll.interval-ms=1500


# =========================================================
# LOCAL WEBRTC / LIVEKIT (Self-Hosted via Docker)
# =========================================================

livekit.url=ws://localhost:7880
livekit.api.key=devkey
livekit.api.secret=secret


# =========================================================
# JWT SECURITY
# =========================================================

spring.security.jwt.secret=${JWT_SECRET:my-super-secret-key-that-is-very-long-and-secure-for-local-dev}
spring.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# =========================================================
# AI / ML MICROSERVICE ENDPOINTS
# =========================================================

hirecraft.ats.service.url=${ATS_SERVICE_URL:https://msuryakumar-hirecraft-ats-scorer.hf.space/score-resume/}
hirecraft.ai.evaluator.url=${EVALUATOR_SERVICE_URL:https://msuryakumar-hirecraft-interview-evaluator.hf.space/evaluate}

# =========================================================
# LOGGING
# =========================================================

logging.level.com.hirecraft=INFO
